<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="duplicate-title duplicate-description"
>
    <title id="duplicate-title">Duplicate Line Remover</title>
    <desc id="duplicate-description">
        Industrial SVG Micro Eco badge showing two exact duplicate lines reduced to one retained line.
    </desc>

    <defs>
        <linearGradient id="badge-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#202a33" />
            <stop offset="55%" stop-color="#11171d" />
            <stop offset="100%" stop-color="#080b0f" />
        </linearGradient>
        <linearGradient id="steel-edge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d7dee3" />
            <stop offset="45%" stop-color="#71808c" />
            <stop offset="100%" stop-color="#35414b" />
        </linearGradient>
        <filter id="badge-shadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
        </filter>
        <filter id="line-glow" x="-40%" y="-80%" width="180%" height="260%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Shared SVG Micro Eco chassis -->
    <g filter="url(#badge-shadow)">
        <polygon
            points="256,24 440,130 440,382 256,488 72,382 72,130"
            fill="url(#badge-body)"
            stroke="url(#steel-edge)"
            stroke-width="12"
        />
        <polygon
            points="256,48 420,142 420,370 256,464 92,370 92,142"
            fill="none"
            stroke="#3d4b58"
            stroke-width="3"
        />
        <path
            d="M112 154 L256 70 L400 154"
            fill="none"
            stroke="#32b8ff"
            stroke-width="5"
            stroke-linecap="round"
        />
    </g>

    <!-- Before: two exact copies -->
    <g fill="none" stroke-linecap="round">
        <path d="M142 218 L247 218" stroke="#d7dee3" stroke-width="13" />
        <path d="M142 246 L247 246" stroke="#32b8ff" stroke-width="13" filter="url(#line-glow)" />
        <circle cx="142" cy="218" r="7" fill="#11171d" stroke="#d7dee3" stroke-width="5" />
        <circle cx="247" cy="218" r="7" fill="#11171d" stroke="#d7dee3" stroke-width="5" />
        <circle cx="142" cy="246" r="7" fill="#11171d" stroke="#32b8ff" stroke-width="5" />
        <circle cx="247" cy="246" r="7" fill="#11171d" stroke="#32b8ff" stroke-width="5" />
    </g>

    <!-- Deterministic removal -->
    <path
        d="M270 232 L305 232 M292 217 L307 232 L292 247"
        fill="none"
        stroke="#7f8b95"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- After: one canonical line retained -->
    <g fill="none" stroke-linecap="round">
        <path d="M326 232 L390 232" stroke="#32b8ff" stroke-width="13" filter="url(#line-glow)" />
        <circle cx="326" cy="232" r="7" fill="#11171d" stroke="#32b8ff" stroke-width="5" />
        <circle cx="390" cy="232" r="7" fill="#11171d" stroke="#32b8ff" stroke-width="5" />
        <path
            d="M350 268 L360 278 L381 252"
            stroke="#35c779"
            stroke-width="9"
            stroke-linejoin="round"
        />
    </g>

    <!-- Tool name -->
    <text
        x="256"
        y="344"
        text-anchor="middle"
        fill="#f4f7f9"
        font-family="Arial Narrow, Segoe UI, Arial, sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="2"
    >DUPLICATE</text>
    <text
        x="256"
        y="380"
        text-anchor="middle"
        fill="#32b8ff"
        font-family="Arial Narrow, Segoe UI, Arial, sans-serif"
        font-size="26"
        font-weight="900"
        letter-spacing="3"
    >LINE REMOVER</text>
    <text
        x="256"
        y="416"
        text-anchor="middle"
        fill="#9ca8b2"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="16"
        font-weight="800"
        letter-spacing="4"
    >SVG MICRO ECO</text>
</svg>
