<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="pathseal-title pathseal-description"
>
    <title id="pathseal-title">PathSeal</title>
    <desc id="pathseal-description">
        Industrial PathSeal badge showing one broken CNC contour sealed by a repair bridge.
    </desc>

    <defs>
        <linearGradient id="badge-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#202a33" />
            <stop offset="55%" stop-color="#11171d" />
            <stop offset="100%" stop-color="#080b0f" />
        </linearGradient>

        <linearGradient id="steel-edge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d7dee3" />
            <stop offset="45%" stop-color="#71808c" />
            <stop offset="100%" stop-color="#35414b" />
        </linearGradient>

        <filter id="badge-shadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow
                dx="0"
                dy="14"
                stdDeviation="14"
                flood-color="#000000"
                flood-opacity="0.5"
            />
        </filter>

        <filter id="repair-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="blur" />

            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Shared SVG Micro Eco chassis -->
    <g filter="url(#badge-shadow)">
        <polygon
            points="256,24 440,130 440,382 256,488 72,382 72,130"
            fill="url(#badge-body)"
            stroke="url(#steel-edge)"
            stroke-width="12"
        />

        <polygon
            points="256,48 420,142 420,370 256,464 92,370 92,142"
            fill="none"
            stroke="#3d4b58"
            stroke-width="3"
        />

        <path
            d="M112 154 L256 70 L400 154"
            fill="none"
            stroke="#ff7a00"
            stroke-width="5"
            stroke-linecap="round"
        />
    </g>

    <!-- One broken CNC contour -->
    <g
        fill="none"
        stroke="#d7dee3"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path
            d="
                M165 285
                L150 250
                L170 205
                L220 175
                L275 175
                L320 205
                L345 240
            "
        />

        <path
            d="
                M340 278
                L315 320
                L260 340
                L205 325
                L165 285
            "
        />
    </g>

    <!-- Endpoint dots -->
    <circle
        cx="345"
        cy="240"
        r="11"
        fill="#11171d"
        stroke="#ff7a00"
        stroke-width="7"
    />

    <circle
        cx="340"
        cy="278"
        r="11"
        fill="#11171d"
        stroke="#ff7a00"
        stroke-width="7"
    />

    <!-- Solid repair foundation -->
    <path
        d="M345 240 L340 278"
        fill="none"
        stroke="#ff7a00"
        stroke-width="10"
        stroke-linecap="round"
        stroke-opacity="0.28"
    />

    <!-- Visible repair bridge -->
    <path
        d="M345 240 L340 278"
        fill="none"
        stroke="#ff8a14"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="3 9"
        filter="url(#repair-glow)"
    />

    <!-- Confirmed seal -->
    <path
        d="M355 292 L366 303 L388 276"
        fill="none"
        stroke="#35c779"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Tool name -->
    <text
        x="256"
        y="390"
        text-anchor="middle"
        fill="#f4f7f9"
        font-family="Arial Narrow, Segoe UI, Arial, sans-serif"
        font-size="48"
        font-weight="900"
        letter-spacing="2"
    >
        PATHSEAL
    </text>

    <!-- Family name -->
    <text
        x="256"
        y="425"
        text-anchor="middle"
        fill="#ff7a00"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="4"
    >
        SVG MICRO ECO
    </text>
</svg>