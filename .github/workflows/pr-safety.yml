name: PR safety

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-production-boundaries:
    name: Public production boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run isolated tests
        run: node --test tests/*.test.mjs
